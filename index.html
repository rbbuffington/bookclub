<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Book Club</title>
<style>
:root{--bg:#09090d;--card:#17171d;--ink:#f6f3ed;--muted:#9c9aa4;--red:#e84b4b;--gold:#f2b84b;--line:#292831;--green:#4ade80}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% -20%,#3c2020,transparent 40%),var(--bg);color:var(--ink);font:15px/1.4 Inter,system-ui,sans-serif}
.wrap{width:min(1440px,calc(100% - 28px));margin:auto;padding:38px 0 70px}
header{margin-bottom:24px}
.kicker{text-transform:uppercase;letter-spacing:.22em;color:var(--red);font-weight:800;font-size:12px}
h1{font:800 clamp(48px,8vw,98px)/.9 Georgia,serif;letter-spacing:-.06em;margin:8px 0 12px}
.sub{color:var(--muted)}
nav{position:sticky;top:8px;z-index:5;display:flex;gap:6px;flex-wrap:wrap;background:#111116e8;backdrop-filter:blur(15px);padding:10px;border:1px solid var(--line);border-radius:16px;margin-bottom:24px}
button{border:0;background:transparent;color:var(--muted);font:700 14px Inter,system-ui;padding:10px 14px;border-radius:10px;cursor:pointer;transition:background .15s,color .15s}
button.active,button:hover{background:var(--red);color:white}
.hero{min-height:275px;border:1px solid var(--line);border-radius:22px;overflow:hidden;margin-bottom:25px;background:#17171d center 28%/cover no-repeat;position:relative;display:flex;align-items:flex-end}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#09090df5 3%,#09090d55 65%,transparent)}
.heroText{position:relative;z-index:1;padding:28px}
.hero h2{font:700 clamp(30px,5vw,62px)/1 Georgia;margin:6px 0}
.score{color:var(--gold);font-weight:800}
.sectionTitle{display:flex;align-items:center;justify-content:space-between;margin:30px 0 12px}
.sectionTitle h2{font:700 28px Georgia;margin:0}
.carouselWrap{position:relative}
.posterGrid{display:grid;grid-template-columns:repeat(10,minmax(95px,1fr));gap:12px;overflow:hidden}
.poster{position:relative;aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:linear-gradient(145deg,#282832,#121217);border:1px solid var(--line);box-shadow:0 12px 30px #0006;cursor:pointer;transition:transform .18s}
.poster:hover{transform:translateY(-4px)}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.poster .fallback{padding:10px;height:100%;display:grid;place-items:center;text-align:center;font:600 13px Georgia;color:var(--muted)}
.badge{position:absolute;top:7px;left:7px;background:#09090dd9;border:1px solid #ffffff25;border-radius:99px;width:29px;height:29px;display:grid;place-items:center;font-weight:900;font-size:13px;z-index:1}
.pts-badge{position:absolute;bottom:7px;left:7px;background:#09090dd9;border:1px solid #ffffff25;border-radius:6px;padding:2px 6px;font:700 11px Inter;color:var(--gold);z-index:1}
.star-badge{position:absolute;top:0;right:0;z-index:2;width:0;height:0;border-style:solid;border-width:0 46px 46px 0;border-color:transparent var(--red) transparent transparent}
.star-badge:after{content:"★";position:absolute;top:4px;right:-40px;font-size:16px;color:white;line-height:1}
.arrow{display:none;position:absolute;top:0;right:-18px;bottom:0;width:40px;align-items:center;justify-content:center;cursor:pointer;z-index:3}
.arrow svg{opacity:.45;transition:opacity .15s}
.arrow:hover svg{opacity:.95}
.arrow.visible{display:flex}
.arrow-left{right:auto;left:-18px}
.poster.overflow{display:none}
.facts{display:none}.facts.active{display:block}
.lbxd-section{display:none}.lbxd-section.active{display:block}
.sel-section{display:none}.sel-section.active{display:block}
.rankings.hidden{display:none}
.factGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px}
.fact{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
.fact h3{margin:5px 0;font:700 22px Georgia}
.fact .big{font:800 46px Georgia;color:var(--gold)}
.fact ol{padding-left:20px;color:var(--muted);margin:10px 0 0}
.fact li{margin:7px 0}.fact li b{color:var(--ink)}
.align-bar-bg{height:6px;background:#2a2a35;border-radius:99px;overflow:hidden;margin:4px 0 3px}
.align-bar{height:100%;border-radius:99px;background:var(--gold)}
.align-pct{font-size:12px;color:var(--muted)}
.winner-tag{display:inline-block;background:rgba(74,222,128,.15);border:1px solid var(--green);color:var(--green);border-radius:6px;font-size:11px;font-weight:800;padding:1px 7px;margin-left:8px;vertical-align:middle}
.loser-tag{display:inline-block;background:rgba(232,75,75,.15);border:1px solid var(--red);color:var(--red);border-radius:6px;font-size:11px;font-weight:800;padding:1px 7px;margin-left:8px;vertical-align:middle}
.pair-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.pair-item{background:#1e1d27;border-radius:10px;padding:12px 14px;font-size:13px}
.pair-item span{color:var(--muted)}.pair-item b{float:right}
.loading{color:var(--muted);padding:20px 0}
.list-header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
.list-header h2{font:700 28px Georgia;margin:4px 0 0}
.sel-link{color:var(--muted);font-size:13px;text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:2px;cursor:pointer;background:none;border-top:0;border-left:0;border-right:0;border-radius:0;padding-left:0;padding-right:0}
.sel-link:hover{color:var(--ink);background:none}
.lbxd-meta{color:var(--muted);font-size:12px;margin-bottom:16px}
.lbxd-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:12px}
.lbxd-card{position:relative;aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:#17171d;border:1px solid var(--line)}
.lbxd-card img{width:100%;height:100%;object-fit:cover;display:block}
.motw-badge{position:absolute;top:7px;left:7px;background:var(--red);color:white;font-size:9px;font-weight:900;padding:3px 6px;border-radius:5px;text-transform:uppercase;letter-spacing:.06em;line-height:1.4;text-align:center}
.motw-tile{grid-column:span 4;grid-row:span 1;display:grid;grid-template-columns:100px 1fr;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.motw-tile-poster{background:#17171d center/cover no-repeat}
.motw-tile-body{padding:16px 20px;display:flex;flex-direction:column;justify-content:center;gap:6px;overflow:hidden}
.motw-tile-body h3{font:700 clamp(14px,1.6vw,22px)/1.1 Georgia;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.motw-tile-body .meta{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.motw-tile-body .overview{color:var(--ink);font-size:12px;line-height:1.5;margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
@media(max-width:1000px){.motw-tile{grid-column:span 3}}
@media(max-width:600px){.motw-tile{grid-column:span 3;grid-template-columns:80px 1fr}}
.lbxd-fallback{padding:10px;height:100%;display:grid;place-items:center;text-align:center;font:600 12px Georgia;color:var(--muted)}
.lbxd-fallback.titled{color:var(--ink);font-size:13px;background:linear-gradient(145deg,#1e1d2a,#141320)}
.lbxd-error{color:var(--muted);padding:24px 0;font-size:14px}
.modal{display:none;position:fixed;inset:0;z-index:20;background:#000b;padding:22px;place-items:center}
.modal.open{display:grid}
.modalCard{width:min(850px,100%);background:#15151b;border:1px solid var(--line);border-radius:20px;overflow:hidden;display:grid;grid-template-columns:260px 1fr}
.modalPoster{min-height:390px;background:#222 center/cover}
.modalBody{padding:28px}
.modalBody h2{font:700 35px Georgia;margin:0 0 8px}
.close{float:right;background:#292832}
.rows{margin-top:20px}
.row{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:10px 0}
.attribution{text-align:center;color:var(--muted);margin-top:38px;font-size:12px}
@media(max-width:1000px){.posterGrid{grid-template-columns:repeat(5,1fr)}.factGrid{grid-template-columns:1fr 1fr}}
@media(max-width:1000px){.lbxd-grid{grid-template-columns:repeat(6,1fr)}}
@media(max-width:600px){.posterGrid{grid-template-columns:repeat(3,1fr)}.factGrid{grid-template-columns:1fr}.lbxd-grid{grid-template-columns:repeat(3,1fr)}.modalCard{grid-template-columns:1fr}.modalPoster{display:none}nav{position:static}.wrap{padding-top:22px}}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <div class="kicker">Casey &middot; Caleb &middot; Will &middot; Blake</div>
    <h1>Book Club</h1>
    <div class="sub">since January 15, 2021</div>
  </header>
  <nav id="nav"></nav>
  <section class="rankings" id="rankings">
    <div class="hero" id="hero">
      <div class="heroText">
        <div class="kicker" id="heroLabel"></div>
        <h2 id="heroTitle"></h2>
        <div class="score" id="heroScore"></div>
      </div>
    </div>
    <div id="lists"></div>
  </section>
  <section class="facts" id="facts">
    <div class="sectionTitle">
      <div><div class="kicker">Across 2020&ndash;2025</div><h2>Book Club by the numbers</h2></div>
    </div>
    <div class="loading" id="factLoading">Building statistics from TMDB&hellip;</div>
    <div id="factGrid"></div>
  </section>
  <section class="lbxd-section" id="lbxdSection">
    <div class="list-header">
      <div>
        <div class="kicker">Every movie</div>
        <h2>The List</h2>
      </div>
      <button class="sel-link" onclick="setActiveTab('sel');buildSel()">View Selections &rarr;</button>
    </div>
    <div class="lbxd-meta" id="lbxdMeta"></div>
    <div class="lbxd-grid" id="lbxdGrid"><div class="lbxd-error">Loading&hellip;</div></div>
  </section>
  <section class="sel-section" id="selSection">
    <div class="list-header">
      <div>
        <div class="kicker">Unanimous picks</div>
        <h2>Selections</h2>
      </div>
      <button class="sel-link" onclick="setActiveTab('lbxd');buildLbxd()">Back to The List &rarr;</button>
    </div>
    <div class="lbxd-meta" id="selMeta"></div>
    <div class="lbxd-grid" id="selGrid"><div class="lbxd-error">Loading&hellip;</div></div>
  </section>
  <div class="attribution">This product uses the TMDB API but is not endorsed or certified by TMDB.</div>
</main>
<div class="modal" id="modal">
  <div class="modalCard">
    <div class="modalPoster" id="modalPoster"></div>
    <div class="modalBody">
      <button class="close" onclick="modal.classList.remove('open')">Close</button>
      <div class="kicker" id="modalYear"></div>
      <h2 id="modalTitle"></h2>
      <div id="modalMeta" class="sub"></div>
      <div class="rows" id="modalRows"></div>
    </div>
  </div>
</div>

const clean=s=>s.replace(/\s*\/\s*.*/,'').replace(/\s*\(.*?\)\s*$/,'').trim();

// Strip year in parens and star ratings from Letterboxd frame-title text
function cleanTitle(raw){
  return raw
    .replace(/\s*\(\d{4}\)\s*$/, '')
    .replace(/\s*[\u2605\u2606\xbd]+\s*$/, '')
    .trim();
}

async function tmdb(title,y){
  const k=y+'|'+title;if(cache[k])return cache[k];
  const q=clean(title);
  try{
    let u=`https://api.themoviedb.org/3/search/movie?api_key=${KEY}&query=${encodeURIComponent(q)}&year=${y}`;
    let j=await(await fetch(u)).json();let m=j.results?.[0];
    if(!m){u=`https://api.themoviedb.org/3/search/movie?api_key=${KEY}&query=${encodeURIComponent(q)}`;j=await(await fetch(u)).json();m=j.results?.[0];}
    if(m){
      const d=await(await fetch(`https://api.themoviedb.org/3/movie/${m.id}?api_key=${KEY}&append_to_response=credits`)).json();
      cache[k]={id:d.id,title:d.title,poster:d.poster_path,backdrop:d.backdrop_path,date:d.release_date,
        directors:(d.credits?.crew||[]).filter(x=>x.job==='Director').map(x=>x.name),
        actors:(d.credits?.cast||[]).slice(0,5).map(x=>x.name)};
      saveCache();return cache[k];
    }
  }catch(e){}return null;
}

async function tmdbPoster(title,yr){
  const k='p|'+title;if(cache[k])return cache[k];
  try{
    let u=`https://api.themoviedb.org/3/search/movie?api_key=${KEY}&query=${encodeURIComponent(title)}${yr?'&year='+yr:''}`;
    const j=await(await fetch(u)).json();const m=j.results?.[0];
    if(m?.poster_path){cache[k]={poster:m.poster_path};saveCache();return cache[k];}
  }catch(e){}return null;
}

const secPage={};
function makePosterSection(label,items,isCons){
  const id='s'+label.replace(/\W/g,'_');
  const vis=items.slice(0,10),ovf=items.slice(10);
  const ph=(item,i,isO)=>{
    const pid='p'+Math.random().toString(36).slice(2);
    const num=item.rank??(i+1);
    const pb=isCons&&item.score!=null?`<span class="pts-badge">${item.score} pts</span>`:'';
    setTimeout(async()=>{
      const dt=await tmdb(item.title,year);
      const node=document.getElementById(pid);
      if(node&&dt?.poster){
        node.innerHTML=`<img src="https://image.tmdb.org/t/p/w342${dt.poster}" alt="${item.title}"><span class="badge">${num}</span>${pb}`;
      }
    },0);
    return `<div class="poster${isO?' overflow':''}" id="${pid}" onclick='openMovie(${JSON.stringify(item.title)},${JSON.stringify(year)})'><div class="fallback">${item.title}</div><span class="badge">${num}</span>${pb}</div>`;
  };
  const all=vis.map((x,i)=>ph(x,i,false)).join('')+ovf.map((x,i)=>ph(x,i+10,true)).join('');
  const ra=ovf.length?`<div class="arrow visible" id="ar_${id}" onclick="slide('${id}',1)"><svg width="28" height="56" viewBox="0 0 28 56" fill="none"><path d="M7 7L21 28L7 49" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`:'';
  const la=`<div class="arrow arrow-left" id="al_${id}" onclick="slide('${id}',-1)"><svg width="28" height="56" viewBox="0 0 28 56" fill="none"><path d="M21 7L7 28L21 49" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`;
  return `<section><div class="sectionTitle"><h2>${label}</h2></div><div class="carouselWrap" id="${id}">${la}<div class="posterGrid" id="g_${id}">${all}</div>${ra}</div></section>`;
}

function slide(id,dir){
  if(!(id in secPage))secPage[id]=0;
  const np=secPage[id]+dir;if(np<0)return;
  const g=document.getElementById('g_'+id);
  const all=[...g.querySelectorAll('.poster')];
  const v=all.filter(p=>!p.classList.contains('overflow'));
  const o=all.filter(p=>p.classList.contains('overflow'));
  if(np>0&&!o.length)return;
  secPage[id]=np;
  v.forEach(p=>p.style.display=np===0?'':'none');
  o.forEach(p=>p.style.display=np>0?'block':'none');
  const la=document.getElementById('al_'+id),ra=document.getElementById('ar_'+id);
  if(la)la.style.display=np>0?'flex':'none';
  if(ra)ra.style.display=(np===0&&o.length)?'flex':'none';
}

async function render(){
  const d=DATA[year],w=d.consensus[0];
  el('#heroLabel').textContent=year+' consensus winner';
  el('#heroTitle').textContent=w.title;
  el('#heroScore').textContent=w.score+' consensus points';
  const h=el('#hero');h.style.backgroundImage='';h.style.backgroundPosition=BP[year]||'center 28%';
  tmdb(w.title,year).then(x=>{if(x?.backdrop)h.style.backgroundImage=`url(https://image.tmdb.org/t/p/w1280${x.backdrop})`;});
  el('#lists').innerHTML=[['Consensus',d.consensus,true],...P.map(p=>[p,d.rankings[p],false])].map(([n,a,ic])=>makePosterSection(n,a,ic)).join('');
}

async function openMovie(title,y){
  const d=DATA[y],x=await tmdb(title,y);
  el('#modalTitle').textContent=x?.title||title;
  el('#modalYear').textContent=y;
  el('#modalMeta').textContent=[x?.date?.slice(0,4),...(x?.directors||[])].filter(Boolean).join(' · ');
  el('#modalPoster').style.backgroundImage=x?.poster?`url(https://image.tmdb.org/t/p/w500${x.poster})`:'';
  const rows=[];
  const c=d.consensus.find(z=>z.title===title);
  if(c)rows.push(['Consensus','#'+c.rank+(c.score!=null?' · '+c.score+' pts':'')]);
  P.forEach(p=>{const z=d.rankings[p].find(z=>z.title===title);rows.push([p,z?'#'+z.rank:'Not ranked']);});
  el('#modalRows').innerHTML=rows.map(r=>`<div class="row"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('');
  el('#modal').classList.add('open');
}

  if(updated){const d=new Date(updated);metaEl.textContent='Last synced '+d.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});}

  // Build motw tile placeholder if needed
  const motwId='motw_tile_'+Math.random().toString(36).slice(2);
  const motwTile=showMotw&&movies.length?`<div class="motw-tile" id="${motwId}">
    <div class="motw-tile-poster"></div>
    <div class="motw-tile-body">
      <div class="kicker">Movie of the Week</div>
      <h3>${movies[0].title}</h3>
      <div class="meta">Loading…</div>
    </div>
  </div>`:'';

  // Fetch and populate motw tile
  if(showMotw&&movies.length){
    setTimeout(async()=>{
      const m=movies[0];
      // Full TMDB fetch for motw (need overview, runtime etc.)
      const q=clean(m.title);
      let info=null;
      try{
        let u=`https://api.themoviedb.org/3/search/movie?api_key=${KEY}&query=${encodeURIComponent(q)}${m.year?'&year='+m.year:''}`;
        let j=await(await fetch(u)).json();
        let res=j.results?.[0];
        if(!res){u=`https://api.themoviedb.org/3/search/movie?api_key=${KEY}&query=${encodeURIComponent(q)}`;j=await(await fetch(u)).json();res=j.results?.[0];}
        if(res){info=await(await fetch(`https://api.themoviedb.org/3/movie/${res.id}?api_key=${KEY}&append_to_response=credits`)).json();}
      }catch(e){}
      const tile=document.getElementById(motwId);
      if(!tile)return;
      const poster=tile.querySelector('.motw-tile-poster');
      const body=tile.querySelector('.motw-tile-body');
      if(info){
        if(info.poster_path)poster.style.backgroundImage=`url(https://image.tmdb.org/t/p/w342${info.poster_path})`;
        const dirs=(info.credits?.crew||[]).filter(x=>x.job==='Director').map(x=>x.name).join(', ')||'';
        const runtime=info.runtime?`${info.runtime} min`:'';
        const year=info.release_date?info.release_date.slice(0,4):'';
        const meta=[year,dirs,runtime].filter(Boolean).join(' · ');
        body.innerHTML=`
          <div class="kicker">Movie of the Week</div>
          <h3>${info.title||m.title}</h3>
          <div class="meta">${meta}</div>
          ${info.overview?`<p class="overview">${info.overview}</p>`:''}`;
      }
    },0);
  }

  gridEl.innerHTML=motwTile+movies.map((m,i)=>{
    const pid='lb'+Math.random().toString(36).slice(2);
    setTimeout(async()=>{
      const dt=await tmdbPoster(m.title,m.year);
      const node=document.getElementById(pid);
      if(node){
        const isSel=selTitles.has(m.title.toLowerCase());
        const star=isSel?`<div class="star-badge"></div>`:'';
        if(dt?.poster){
          node.innerHTML=`<img src="https://image.tmdb.org/t/p/w185${dt.poster}" alt="${m.title}">${star}`;
        } else {
          node.innerHTML=`<div class="lbxd-fallback titled">${m.title}</div>${star}`;
        }
      }
    },0);
    return `<div class="lbxd-card" id="${pid}"><div class="lbxd-fallback">${m.title}</div></div>`;
  }).join('');
}

let lbxdLoaded=false;
async function buildLbxd(){
  if(lbxdLoaded)return;lbxdLoaded=true;
  const grid=el('#lbxdGrid'),meta=el('#lbxdMeta');
  try{
    const p=await loadJson('movies.json');
    const movies=p.movies||[];
    if(!movies.length)throw new Error('List is empty — run the bookmarklet first.');
    // Load selections for star badges
    let selTitles=new Set();
    try{const sp=await loadJson('selections.json');(sp.movies||[]).forEach(m=>selTitles.add(m.title.toLowerCase()));}catch(e){}
    renderGrid(grid,meta,movies,p.updated,true,selTitles);
  }catch(e){
    grid.innerHTML=`<div class="lbxd-error">${e.message}</div>`;
  }
}

let selLoaded=false;
async function buildSel(){
  if(selLoaded)return;selLoaded=true;
  const grid=el('#selGrid'),meta=el('#selMeta');
  try{
    const p=await loadJson('selections.json');
    const movies=p.movies||[];
    if(!movies.length)throw new Error('No selections yet — run the Selections bookmarklet first.');
    renderGrid(grid,meta,movies,p.updated,false);
  }catch(e){
    grid.innerHTML=`<div class="lbxd-error">${e.message}</div>`;
  }
}

modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open');};
buildNav();
setActiveTab('rankings');
render();

</script>
