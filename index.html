<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Book Club</title>
<style>
:root{--bg:#09090d;--card:#17171d;--ink:#f6f3ed;--muted:#9c9aa4;--red:#e84b4b;--gold:#f2b84b;--line:#292831;--green:#4ade80}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% -20%,#3c2020,transparent 40%),var(--bg);color:var(--ink);font:15px/1.4 Inter,system-ui,sans-serif}
.wrap{width:min(1440px,calc(100% - 28px));margin:auto;padding:38px 0 70px}
header{margin-bottom:24px}
.kicker{text-transform:uppercase;letter-spacing:.22em;color:var(--red);font-weight:800;font-size:12px}
h1{font:800 clamp(48px,8vw,98px)/.9 Georgia,serif;letter-spacing:-.06em;margin:8px 0 12px}
.sub{color:var(--muted)}
nav{position:sticky;top:8px;z-index:5;display:flex;gap:6px;flex-wrap:wrap;background:#111116e8;backdrop-filter:blur(15px);padding:10px;border:1px solid var(--line);border-radius:16px;margin-bottom:24px}
button{border:0;background:transparent;color:var(--muted);font:700 14px Inter,system-ui;padding:10px 14px;border-radius:10px;cursor:pointer}
button.active,button:hover{background:var(--red);color:white}
.hero{min-height:275px;border:1px solid var(--line);border-radius:22px;overflow:hidden;margin-bottom:25px;background:#17171d center 28%/cover no-repeat;position:relative;display:flex;align-items:flex-end}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#09090df5 3%,#09090d55 65%,transparent)}
.heroText{position:relative;z-index:1;padding:28px}
.hero h2{font:700 clamp(30px,5vw,62px)/1 Georgia;margin:6px 0}
.score{color:var(--gold);font-weight:800}
.sectionTitle{display:flex;align-items:center;justify-content:space-between;margin:30px 0 12px}
.sectionTitle h2{font:700 28px Georgia;margin:0}
/* CAROUSEL */
.carouselWrap{position:relative}
.posterGrid{display:grid;grid-template-columns:repeat(10,minmax(95px,1fr));gap:12px;overflow:hidden}
.poster{position:relative;aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:linear-gradient(145deg,#282832,#121217);border:1px solid var(--line);box-shadow:0 12px 30px #0006;cursor:pointer;transition:transform .18s}
.poster:hover{transform:translateY(-4px)}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.poster .fallback{padding:10px;height:100%;display:grid;place-items:center;text-align:center;font:600 13px Georgia;color:var(--muted)}
.badge{position:absolute;top:7px;left:7px;background:#09090dd9;border:1px solid #ffffff25;border-radius:99px;width:29px;height:29px;display:grid;place-items:center;font-weight:900;font-size:13px;z-index:1}
.pts-badge{position:absolute;bottom:7px;left:7px;background:#09090dd9;border:1px solid #ffffff25;border-radius:6px;padding:2px 6px;font:700 11px Inter;color:var(--gold);z-index:1}
.arrow{display:none;position:absolute;top:0;right:-18px;bottom:0;width:40px;align-items:center;justify-content:center;cursor:pointer;z-index:3}
.arrow svg{opacity:.45;transition:opacity .15s}
.arrow:hover svg{opacity:.95}
.arrow.visible{display:flex}
.arrow-left{right:auto;left:-18px}
.poster.overflow{display:none}
/* FACTS */
.facts{display:none}
.facts.active{display:block}
/* LETTERBOXD */
.lbxd{display:none}
.lbxd.active{display:block}
.rankings.hidden{display:none}
.factGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px}
.fact{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
.fact h3{margin:5px 0;font:700 22px Georgia}
.fact .big{font:800 46px Georgia;color:var(--gold)}
.fact ol{padding-left:20px;color:var(--muted);margin:10px 0 0}
.fact li{margin:7px 0}
.fact li b{color:var(--ink)}
.align-bar-wrap{margin:10px 0 4px}
.align-bar-bg{height:6px;background:#2a2a35;border-radius:99px;overflow:hidden}
.align-bar{height:100%;border-radius:99px;background:var(--gold);transition:width .5s}
.align-pct{font-size:12px;color:var(--muted);margin-top:3px}
.winner-tag{display:inline-block;background:rgba(74,222,128,.15);border:1px solid var(--green);color:var(--green);border-radius:6px;font-size:11px;font-weight:800;padding:1px 7px;margin-left:8px;vertical-align:middle}
.loser-tag{display:inline-block;background:rgba(232,75,75,.15);border:1px solid var(--red);color:var(--red);border-radius:6px;font-size:11px;font-weight:800;padding:1px 7px;margin-left:8px;vertical-align:middle}
.pair-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.pair-item{background:#1e1d27;border-radius:10px;padding:12px 14px;font-size:13px}
.pair-item span{color:var(--muted)}
.pair-item b{float:right}
.loading{color:var(--muted);padding:20px 0}
/* LETTERBOXD LIST */
.lbxd-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:16px;margin-top:16px}
.lbxd-card{position:relative;aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:#17171d;border:1px solid var(--line)}
.lbxd-card img{width:100%;height:100%;object-fit:cover;display:block}
.lbxd-title{position:absolute;bottom:0;left:0;right:0;padding:8px;background:linear-gradient(0deg,#000e,transparent);font-size:12px;font-weight:700;line-height:1.2}
.this-week{position:absolute;top:7px;right:7px;background:var(--red);color:white;font-size:10px;font-weight:800;padding:2px 6px;border-radius:5px;text-transform:uppercase;letter-spacing:.05em}
.lbxd-loading{color:var(--muted);padding:30px 0}
/* MODAL */
.modal{display:none;position:fixed;inset:0;z-index:20;background:#000b;padding:22px;place-items:center}
.modal.open{display:grid}
.modalCard{width:min(850px,100%);background:#15151b;border:1px solid var(--line);border-radius:20px;overflow:hidden;display:grid;grid-template-columns:260px 1fr}
.modalPoster{min-height:390px;background:#222 center/cover}
.modalBody{padding:28px}
.modalBody h2{font:700 35px Georgia;margin:0 0 8px}
.close{float:right;background:#292832}
.rows{margin-top:20px}
.row{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:10px 0}
.attribution{text-align:center;color:var(--muted);margin-top:38px;font-size:12px}
@media(max-width:1000px){.posterGrid{grid-template-columns:repeat(5,1fr)}.factGrid{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.posterGrid{grid-template-columns:repeat(3,1fr)}.factGrid{grid-template-columns:1fr}.modalCard{grid-template-columns:1fr}.modalPoster{display:none}nav{position:static}.wrap{padding-top:22px}}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <div class="kicker">Casey &middot; Caleb &middot; Will &middot; Blake</div>
    <h1>Book Club</h1>
    <div class="sub">since January 15, 2021</div>
  </header>
  <nav id="nav"></nav>

  <section class="rankings" id="rankings">
    <div class="hero" id="hero">
      <div class="heroText">
        <div class="kicker" id="heroLabel"></div>
        <h2 id="heroTitle"></h2>
        <div class="score" id="heroScore"></div>
      </div>
    </div>
    <div id="lists"></div>
  </section>

  <section class="facts" id="facts">
    <div class="sectionTitle">
      <div><div class="kicker">Across 2020&ndash;2025</div><h2>Book Club by the numbers</h2></div>
    </div>
    <div class="loading" id="factLoading">Building cast and director statistics from TMDB&hellip;</div>
    <div id="factGrid"></div>
  </section>

  <section class="lbxd" id="lbxd">
    <div class="sectionTitle">
      <div><div class="kicker">Letterboxd</div><h2>The full list</h2></div>
    </div>
    <div class="lbxd-loading" id="lbxdLoading">Fetching from Letterboxd&hellip;</div>
    <div class="lbxd-grid" id="lbxdGrid"></div>
  </section>

  <div class="attribution">This product uses the TMDB API but is not endorsed or certified by TMDB.</div>
</main>

<div class="modal" id="modal">
  <div class="modalCard">
    <div class="modalPoster" id="modalPoster"></div>
    <div class="modalBody">
      <button class="close" onclick="modal.classList.remove('open')">Close</button>
      <div class="kicker" id="modalYear"></div>
      <h2 id="modalTitle"></h2>
      <div id="modalMeta" class="sub"></div>
      <div class="rows" id="modalRows"></div>
    </div>
  </div>
</div>

const cache = JSON.parse(localStorage.getItem('bookclub_tmdb_v4') || '{}');
function saveCache() { localStorage.setItem('bookclub_tmdb_v4', JSON.stringify(cache)); }

const clean = s => s.replace(/\s*\/\s*.*/,'').replace(/\s*\(.*?\)\s*$/,'').trim();

async function tmdb(title, y) {
  const k = y + '|' + title;
  if (cache[k]) return cache[k];
  const q = clean(title);
  try {
    let u = `https://api.themoviedb.org/3/search/movie?api_key=${KEY}&query=${encodeURIComponent(q)}&year=${y}`;
    let j = await (await fetch(u)).json();
    let m = j.results?.[0];
    if (!m) {
      u = `https://api.themoviedb.org/3/search/movie?api_key=${KEY}&query=${encodeURIComponent(q)}`;
      j = await (await fetch(u)).json();
      m = j.results?.[0];
    }
    if (m) {
      const d = await (await fetch(`https://api.themoviedb.org/3/movie/${m.id}?api_key=${KEY}&append_to_response=credits`)).json();
      cache[k] = {
        id:d.id, title:d.title, poster:d.poster_path, backdrop:d.backdrop_path,
        date:d.release_date,
        directors:(d.credits?.crew||[]).filter(x=>x.job==='Director').map(x=>x.name),
        actors:(d.credits?.cast||[]).slice(0,5).map(x=>x.name)
      };
      saveCache();
      return cache[k];
    }
  } catch(e) {}
  return null;
}

async function tmdbByTitle(title) {
  const k = 'any|'+title;
  if (cache[k]) return cache[k];
  try {
    const u = `https://api.themoviedb.org/3/search/movie?api_key=${KEY}&query=${encodeURIComponent(title)}`;
    const j = await (await fetch(u)).json();
    const m = j.results?.[0];
    if (m) { cache[k]={poster:m.poster_path}; saveCache(); return cache[k]; }
  } catch(e){}
  return null;
}

function el(s) { return document.querySelector(s); }

function buildNav() {
  const navEl = el('#nav');
  const tabs = ['facts','lbxd'];
  const tabLabels = {'facts':'Fun facts','lbxd':'The list'};
  const yearBtns = Object.keys(DATA).reverse().map(y =>
    `<button class="${y===year?'active':''}" data-year="${y}">${y}</button>`
  ).join('');
  const tabBtns = tabs.map(t =>
    `<button data-tab="${t}" style="${t==='facts'?'margin-left:auto':''}">${tabLabels[t]}</button>`
  ).join('');
  navEl.innerHTML = yearBtns + tabBtns;

  navEl.querySelectorAll('[data-year]').forEach(b => b.onclick = () => {
    year = b.dataset.year;
    el('#facts').classList.remove('active');
    el('#lbxd').classList.remove('active');
    el('#rankings').classList.remove('hidden');
    buildNav(); render();
  });
  tabs.forEach(t => {
    navEl.querySelector(`[data-tab="${t}"]`).onclick = () => {
      el('#facts').classList.remove('active');
      el('#lbxd').classList.remove('active');
      el(`#${t}`).classList.add('active');
      el('#rankings').classList.add('hidden');
      navEl.querySelectorAll('[data-year]').forEach(b=>b.classList.remove('active'));
      navEl.querySelector(`[data-tab="${t}"]`).classList.add('active');
      if (t==='facts' && !factsDone) buildFacts();
      if (t==='lbxd' && !lbxdDone) buildLbxd();
    };
  });
}

const sectionPage = {};
function makePosterSection(label, items, isConsensus) {
  const id = 'sec_' + label.replace(/\W/g,'_');
  const visible = items.slice(0,10), overflow = items.slice(10);

  const posterHTML = (item, i, isOvf) => {
    const pid = 'p'+Math.random().toString(36).slice(2);
    const num = item.rank ?? (i+1);
    const ptsHtml = isConsensus && item.score!=null ? `<span class="pts-badge">${item.score} pts</span>` : '';
    setTimeout(async()=>{
      const dt = await tmdb(item.title, year);
      const node = document.getElementById(pid);
      if (node && dt?.poster) node.innerHTML = `<img src="https://image.tmdb.org/t/p/w342${dt.poster}" alt="${item.title}"><span class="badge">${num}</span>${ptsHtml}`;
    },0);
    return `<div class="poster${isOvf?' overflow':''}" id="${pid}" onclick='openMovie(${JSON.stringify(item.title)},${JSON.stringify(year)})'><div class="fallback">${item.title}</div><span class="badge">${num}</span>${ptsHtml}</div>`;
  };

  const allPosters = visible.map((x,i)=>posterHTML(x,i,false)).join('') + overflow.map((x,i)=>posterHTML(x,i+10,true)).join('');
  const rArrow = overflow.length ? `<div class="arrow visible" id="arr_r_${id}" onclick="slideSection('${id}',1)"><svg width="28" height="56" viewBox="0 0 28 56" fill="none"><path d="M7 7L21 28L7 49" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>` : '';
  const lArrow = `<div class="arrow arrow-left" id="arr_l_${id}" onclick="slideSection('${id}',-1)"><svg width="28" height="56" viewBox="0 0 28 56" fill="none"><path d="M21 7L7 28L21 49" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`;
  return `<section><div class="sectionTitle"><h2>${label}</h2></div><div class="carouselWrap" id="${id}">${lArrow}<div class="posterGrid" id="grid_${id}">${allPosters}</div>${rArrow}</div></section>`;
}

function slideSection(id, dir) {
  if (!(id in sectionPage)) sectionPage[id] = 0;
  const newPage = sectionPage[id] + dir;
  if (newPage < 0) return;
  const grid = document.getElementById('grid_'+id);
  const all = [...grid.querySelectorAll('.poster')];
  const vis = all.filter(p=>!p.classList.contains('overflow'));
  const ovf = all.filter(p=>p.classList.contains('overflow'));
  if (newPage > 0 && !ovf.length) return;
  sectionPage[id] = newPage;
  vis.forEach(p=>p.style.display = newPage===0?'':'none');
  ovf.forEach(p=>p.style.display = newPage>0?'block':'none');
  const la = document.getElementById('arr_l_'+id);
  const ra = document.getElementById('arr_r_'+id);
  if (la) la.style.display = newPage>0?'flex':'none';
  if (ra) ra.style.display = (newPage===0&&ovf.length)?'flex':'none';
}

async function render() {
  const d = DATA[year], w = d.consensus[0];
  el('#heroLabel').textContent = year+' consensus winner';
  el('#heroTitle').textContent = w.title;
  el('#heroScore').textContent = w.score+' consensus points';
  const heroEl = el('#hero');
  heroEl.style.backgroundImage = '';
  heroEl.style.backgroundPosition = BACKDROP_POS[year]||'center 28%';
  tmdb(w.title, year).then(x=>{ if(x?.backdrop) heroEl.style.backgroundImage=`url(https://image.tmdb.org/t/p/w1280${x.backdrop})`; });
  const groups = [['Consensus',d.consensus,true],...P.map(p=>[p,d.rankings[p],false])];
  el('#lists').innerHTML = groups.map(([n,a,ic])=>makePosterSection(n,a,ic)).join('');
}

async function openMovie(title, y) {
  const d = DATA[y], x = await tmdb(title, y);
  el('#modalTitle').textContent = x?.title||title;
  el('#modalYear').textContent = y;
  el('#modalMeta').textContent = [x?.date?.slice(0,4),...(x?.directors||[])].filter(Boolean).join(' · ');
  el('#modalPoster').style.backgroundImage = x?.poster?`url(https://image.tmdb.org/t/p/w500${x.poster})`:'';
  const rows = [];
  const c = d.consensus.find(z=>z.title===title);
  if (c) rows.push(['Consensus','#'+c.rank+(c.score!=null?' · '+c.score+' pts':'')]);
  P.forEach(p=>{ const z=d.rankings[p].find(z=>z.title===title); rows.push([p,z?'#'+z.rank:'Not ranked']); });
  el('#modalRows').innerHTML = rows.map(r=>`<div class="row"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('');
  el('#modal').classList.add('open');
}

function pct(score) { return Math.round(score*100); }

async function buildFacts() {
  factsDone = true;
  const A = ALIGN;

  // Alignment section HTML
  const alignHTML = `

      <div style="margin:16px 0 6px">
        ${P.map(p=>`<div style="margin-bottom:14px">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
            <b>${p}${p===A.least_aligned?'<span class="loser-tag">most divergent</span>':''}</b>

          <div class="align-pct">Worst year: ${A.worst_year[p].year} (${pct(A.worst_year[p].score)}%)</div>
        </div>`).join('')}
      </div>
    </article>
    <article class="fact">
      <div class="kicker">Who agrees with whom</div>
      <h3>Pairwise alignment</h3>
      <div class="pair-grid">
        ${Object.entries(A.pairwise).map(([k,v])=>{
          const [p1,p2]=k.split('_');
          return `<div class="pair-item"><span>${p1} &amp; ${p2}</span><b>${pct(v)}%</b></div>`;
        }).join('')}
      </div>
      <div style="margin-top:14px;color:var(--muted);font-size:12px">Based on average rank difference across shared top-10 picks, 2020&ndash;2025.</div>
    </article>
    <article class="fact">
      <div class="kicker">Boldest #1 picks</div>
      <h3>Hot takes</h3>
      <ol>${A.hot_takes.map(x=>`<li><b>${x.title}</b> &middot; ${x.person} (${x.year}) &middot; others avg #${x.avg_others_rank}</li>`).join('')}</ol>
    </article>
  </div>`;

  // TMDB stats
  const unique = new Map();
  const perfect = [];
  Object.entries(DATA).forEach(([y,d])=>{
    d.consensus.forEach(x=>unique.set(y+'|'+x.title,{y,title:x.title}));
    P.forEach(p=>d.rankings[p].forEach(x=>unique.set(y+'|'+x.title,{y,title:x.title})));
    if(d.consensus[0]?.score===40) perfect.push(`${d.consensus[0].title} (${y})`);

  const items=[...unique.values()];
  for(let i=0;i<items.length;i++){

async function buildLbxd() {
  lbxdDone = true;
  el('#lbxdLoading').textContent = 'Fetching from Letterboxd\u2026';
  // Letterboxd doesn't allow direct CORS fetching from a browser.
  // We use a CORS proxy approach - allorigins.win
  const pages = [
    'https://letterboxd.com/rbbuffington/list/book-club/',
    'https://letterboxd.com/rbbuffington/list/book-club/page/2/',
    'https://letterboxd.com/rbbuffington/list/book-club/page/3/'
  ];
  const movies = [];
  for (let i = 0; i < pages.length; i++) {
    try {
      el('#lbxdLoading').textContent = `Fetching Letterboxd page ${i+1} of ${pages.length}\u2026`;
      const proxy = `https://api.allorigins.win/get?url=${encodeURIComponent(pages[i])}`;
      const resp = await fetch(proxy, {signal: AbortSignal.timeout(10000)});
      const json = await resp.json();
      const html = json.contents;
      // Parse film slugs and titles from Letterboxd HTML
      const re = /data-film-slug="([^"]+)"[^>]*data-film-name="([^"]+)"/g;
      let match;
      while ((match = re.exec(html)) !== null) {
        const slug = match[1], title = match[2];
        if (!movies.find(m=>m.slug===slug)) movies.push({slug, title});
      }
    } catch(e) {
      // Try alternate regex pattern
    }
  }

  if (!movies.length) {
    el('#lbxdLoading').textContent = "Couldn't load Letterboxd list. Check the console for details.";
    return;
  }

  el('#lbxdLoading').style.display = 'none';
  const grid = el('#lbxdGrid');

  // Render cards — first is "this week"
  const cards = movies.map((m, i) => {
    const pid = 'lb'+Math.random().toString(36).slice(2);
    const thisWeek = i === 0 ? `<div class="this-week">This week</div>` : '';
    setTimeout(async()=>{
      const dt = await tmdbByTitle(m.title);
      const node = document.getElementById(pid);
      if (node && dt?.poster) {
        node.innerHTML = `<img src="https://image.tmdb.org/t/p/w185${dt.poster}" alt="${m.title}">
          ${thisWeek}<div class="lbxd-title">${m.title}</div>`;
      }
    }, 0);
    return `<div class="lbxd-card" id="${pid}"><div class="fallback" style="padding:10px;font-size:12px;color:var(--muted);height:100%;display:grid;place-items:center;text-align:center">${m.title}</div>${thisWeek}</div>`;
  });
  grid.innerHTML = cards.join('');
}

modal.onclick = e => { if(e.target===modal) modal.classList.remove('open'); };
buildNav();
